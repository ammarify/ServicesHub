name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please leave out passwords, API keys and real customer data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as Support Agent
        2. Open Support and select a ticket
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - API
        - Live support (sockets)
        - AI Copilot
        - Setup or documentation
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options:
        - Super Admin
        - Manager
        - Support Agent
        - Finance
        - Not signed in
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: API console output, browser console errors or screenshots help a lot.
